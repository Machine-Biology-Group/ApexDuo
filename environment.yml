# ApexDuo — conda environment
# Create with:  conda env create -f environment.yml  &&  conda activate apexduo
name: apexduo
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.11.0
  - cudatoolkit=11.3        # omit for a CPU-only install
  - numpy>=1.21,<1.27
  - pandas>=1.3
  - scipy>=1.7
  - scikit-learn>=1.0
  - matplotlib>=3.4
  - biopython>=1.79
  - pip
  - pip:
      - modlamp>=4.3
      - rdkit-pypi>=2022.3.1
